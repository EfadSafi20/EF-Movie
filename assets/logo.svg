<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="50%" stop-color="#9B30FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A54"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Icon -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="107" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Outer Glow Behind Symbol -->
  <path d="M120 120 L270 120 L270 180 L185 180 L185 225 L255 225 L255 285 L185 285 L185 392 L120 392 Z" fill="url(#brandGrad)" filter="url(#glow)" opacity="0.6"/>
  <path d="M295 120 L400 120 L400 180 L295 180 Z M295 225 L375 225 L375 285 L295 285 Z M295 330 L390 330 L390 392 L295 392 Z" fill="url(#brandGrad)" filter="url(#glow)" opacity="0.6"/>

  <!-- Geometric Modern 'E' -->
  <path d="M120 120 L260 120 C270 120 275 125 275 135 L275 165 C275 175 270 180 260 180 L195 180 L195 225 L245 225 C255 225 260 230 260 240 L260 270 C260 280 255 285 245 285 L195 285 L195 377 C195 387 190 392 180 392 L135 392 C125 392 120 387 120 377 Z" fill="url(#brandGrad)"/>

  <!-- Geometric Modern 'F' with integrated Play Chevron -->
  <path d="M290 120 L395 120 C405 120 410 125 410 135 L410 165 C410 175 405 180 395 180 L350 180 L350 225 L380 225 C390 225 395 230 395 240 L395 270 C395 280 390 285 380 285 L350 285 L350 377 C350 387 345 392 335 392 L305 392 C295 392 290 387 290 377 Z" fill="url(#accentGrad)"/>
  
  <!-- Sleek Cinema Play Icon Accent -->
  <polygon points="230,230 275,255 230,280" fill="#FFFFFF" opacity="0.95"/>
</svg>
